<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow And Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px black;
        }
        .text-shadow{
            text-shadow: 2px 3px 5px black;
            outline: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="box">
I am a box with shadow example
    </div>
    <p class="text-shadow">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Veritatis delectus eum corporis quisquam optio, quod debitis inventore, reiciendis nesciunt, assumenda excepturi nihil? Commodi ea, minus nostrum possimus numquam assumenda qui!</p>
    </div>
</body>
</html>
