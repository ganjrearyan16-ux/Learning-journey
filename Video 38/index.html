<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Flexbox</title>
    <style>
      .container {
        border: 2px solid red;
        display: flex;
        /* height ; */
        /* justify-content: center; */
        align-items: center;
        /* flex-direction: column-reverse; */
        flex-wrap: wrap;
        /* align-content: flex-start; */
        /* there is no justify items in flexbox */
        flex-flow: row wrap;
        /* gap: 30px;
        row-gap: 20px; */
        gap:40px 10px;
        height: 560px;
      }
      .item {
      /* flex-grow: 1; */
        height: 70px;
        width: 70px;
        border: 2px solid black;
        /* margin: 4px; */
        background-color: blue;
        
      }
      .order-1{
        order: 1;
      }
      .order-2{
        order: 2;
      }
      .order-3{
        order: 3;
      }

       .item1{
        /* flex-grow: 6; */
        /* flex-shrink: 2; */
        align-self: flex-end;
       }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
       <div class="item order-1">4</div>
      
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    
     
      </div>
    </main>
  </body>
</html>
