<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Object-fit, Position and Object-cover</title>
    <style>
      .container {
        height: 488px;
        width: 466px;
        /* background-color: aqua; */
        border: 2px solid blue;
        background-image:url(https://dynamic-media-cdn.tripadvisor.com/media/photo-o/28/66/93/04/caption.jpg?w=800&h=800&s=1) ;
        background-position: center center;
        background-repeat: no-repeat;
      }
      img {
        width: 466px;
        height: 488px;
        object-fit: cover;
        object-position: top right;
        /* object-fit: fill; */
        
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- <img
        src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/28/66/93/04/caption.jpg?w=800&h=800&s=1"
        alt=""
      /> -->
    </div>
  </body>
</html>
