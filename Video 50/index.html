<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img1{
            filter: blur(5px);
        }
        .img2{
            filter: brightness(1.45); 
            /* we can adjust contrast and my more things */
        }
        .img3{
             filter: grayscale(50);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHLq528VPBa00KxSXCevZ1lZ5SnwilQ33GVPrbjFtyy5TTsj22c4PYhkxa&s=10" alt="">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0I7eAi5benwsroKPz83lpex3pOAvqK913rNofDbszug&s=10" alt="">
        <img class="img3" src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Salman_Khan_snapped_at_the_Angry_Young_Men_trailer_launch.jpg" alt="">
    </div>
</body>
</html>
