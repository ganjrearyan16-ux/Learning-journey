<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apka Task Manager</title>
    <style>
body{
background-color: rgb(18, 18, 56);
 margin: 0;
    font-family: Arial, sans-serif;
    background-color: rgb(18,18,56);

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}
.container{
   
       width:400px;
    max-width:90%;
    padding:25px;
    border-radius:12px;

    background:white;

    box-shadow:0 8px 20px rgba(0,0,0,.25);
  

}

h2{
  text-align:center;
    color:#333
}

.input-area{
      display:flex;
    gap:10px;
    margin-top:20px;
}
#addbtn{
   
padding:12px 18px;

background:#7300ff;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

#taskInput{
     flex:1;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

    outline:none;
}

#addbtn:hover{

background:#000000;

}

#tasklist{

margin-top:25px;

padding:0;

list-style:none;

}

#tasklist li{

display:flex;

justify-content:space-between;

align-items:center;

padding:12px;

margin:10px 0;

background:#f4f4f4;

border-radius:8px;

}

*{

transition:.25s;

}

*{

margin:0;

padding:0;

box-sizing:border-box;

}
.welcome{
    position: absolute;
    top:189px;
     animation: 
    flowHorizontal 1s linear infinite,
    waveVertical 1s ease-in-out infinite alternate;
    color: #ccc;
    font-weight: 500;
   font-family:"'Noto Sans Devanagari', 'Fira Code', 'Courier New', monospace";
  
}
@keyframes flowHorizontal {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 300% 50%;
  }
}

/* Subtle vertical fluid waving effect */
@keyframes waveVertical {
  0% {
    transform: translateY(0px) skewX(0deg);
  }
  50% {
    transform: translateY(-4px) skewX(2deg);
  }
  100% {
    transform: translateY(4px) skewX(-2deg);
  }
}
    </style>
</head>
<body>
    <div class="welcome">
        <h1>नमस्ते !</h1>
    </div>
    <div class="container">
        <h2>Apka Task Manager</h2>
       <div class="input-area">
        <input type="text" id="taskInput" placeholder="Task likho...">
        <button id="addbtn">Add</button>
       </div>
       <ul id="tasklist"></ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
