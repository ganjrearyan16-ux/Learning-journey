<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Multicolor website</title>
    <style>
      :root {
        --primary-color: rgb(139, 139, 233);
        --text-color: white;
        --secondary-color: aqua;
      }
      body {
        background-color: var(--secondary-color);
      }
      * {
        margin: 0;
        padding: 0;
      }
      ul li {
        list-style: none;
      }
      ul li {
        display: inline;
        padding: 20px;
      }
      nav {
        background-color: var(--primary-color);
      }
      ul li a {
        color: var(--text-color);
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/">About</a></li>
          <li><a href="/">services</a></li>
          <li><a href="/">Contact</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
