<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS display property</title>
    <style>
    *{
        margin: 0;
        padding: 0;
    }
.box{
    border: 3px rgb(140, 22, 9);
    display: inline-block;
    padding: 45px;
    margin: 34px;
    width: 100px;
    
}
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <div class="box">also a nice box</div>
    <span>
        I am a good boy
    </span>
    <span>for sure</span>
</body>
</html>
